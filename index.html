<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,
      maximum-scale=1,user-scalable=no">

<title>Retro Land - Game Boy</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    color:#e5efc8;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#bar{
    height:50px;
    background:#1c2418;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 12px;
    box-sizing:border-box;
}

button{
    background:#293426;
    color:#e5efc8;
    border:1px solid #607052;
    border-radius:6px;
    padding:7px 11px;
    font-weight:bold;
}

#stage{
    height:calc(100% - 80px);
    display:flex;
    align-items:center;
    justify-content:center;
}

#gameboy{
    width:320px;
    height:288px;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#cbd99e;
    border:8px solid #20271d;
    box-sizing:content-box;
}

#status{
    position:fixed;
    left:50%;
    top:60px;
    transform:translateX(-50%);
    font-size:13px;
    z-index:100;
}

#hint{
    text-align:center;
    height:30px;
    font-size:12px;
    opacity:.8;
    padding-top:7px;
    box-sizing:border-box;
}

#actions{
    position:fixed;
    right:28px;
    bottom:40px;
    display:flex;
    gap:12px;
    z-index:50;
}

.action{
    width:58px;
    height:58px;
    border-radius:50%;
    font-size:16px;
    padding:0;
}

#menu{
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    bottom:25px;
    display:flex;
    gap:10px;
    z-index:50;
}

.menuBtn{
    width:75px;
    height:30px;
    padding:0;
    font-size:11px;
}

.action:focus,
.menuBtn:focus{
    outline:3px solid #dce9b8;
    outline-offset:3px;
}
</style>
</head>

<body>

<div id="bar">
    <b>RETRO LAND — GAME BOY</b>

    <span>
        <button id="pause">PAUSE</button>
        <button id="reset">RESET</button>
    </span>
</div>

<div id="stage">
    <canvas id="gameboy"
            width="160"
            height="144">
    </canvas>
</div>

<div id="status">
    Loading Game Boy emulator...
</div>

<div id="hint">
    DualSense D-pad / Left Stick = D-pad ·
    Cursor + X = A / B / START / SELECT
</div>

<div id="actions">
    <button class="action" id="b">B</button>
    <button class="action" id="a">A</button>
</div>

<div id="menu">
    <button class="menuBtn" id="select">SELECT</button>
    <button class="menuBtn" id="start">START</button>
</div>


<!--
    REAL GAME BOY EMULATOR
    Loaded directly from the official GitHub source.
-->
<script src="https://raw.githubusercontent.com/juchi/gameboy.js/master/dist/gameboy.min.js"></script>


<script>
"use strict";

const canvas =
    document.getElementById("gameboy");

const status =
    document.getElementById("status");

let gb = null;


/* --------------------------------------------------
   KEYBOARD BRIDGE
-------------------------------------------------- */

function key(code,down){

    document.dispatchEvent(
        new KeyboardEvent(
            down ? "keydown" : "keyup",
            {
                key:code,
                code:code,
                bubbles:true
            }
        )
    );

}


/*
    gameboy.js uses:

    Arrow keys = D-pad
    G = A
    B = B
    H = START
    N = SELECT
*/


const keyMap = {

    a:"KeyG",
    b:"KeyB",
    start:"KeyH",
    select:"KeyN"

};


/* --------------------------------------------------
   ON-SCREEN A/B/START/SELECT
-------------------------------------------------- */

function virtualButton(id,name){

    const button =
        document.getElementById(id);

    function down(e){

        e.preventDefault();
        e.stopPropagation();

        key(keyMap[name],true);
    }

    function up(e){

        e.preventDefault();
        e.stopPropagation();

        key(keyMap[name],false);
    }

    button.addEventListener(
        "pointerdown",
        down,
        {passive:false}
    );

    button.addEventListener(
        "pointerup",
        up,
        {passive:false}
    );

    button.addEventListener(
        "pointercancel",
        up,
        {passive:false}
    );

    button.addEventListener(
        "pointerleave",
        up,
        {passive:false}
    );

}

virtualButton("a","a");
virtualButton("b","b");
virtualButton("start","start");
virtualButton("select","select");


/* --------------------------------------------------
   DUALSENSE
   SAME WORKING MAPPING
-------------------------------------------------- */

const padState = {

    left:false,
    right:false,
    up:false,
    down:false

};

function updatePad(){

    try{

        const pads =
            navigator.getGamepads
            ? navigator.getGamepads()
            : [];

        let g = null;

        for(const p of pads){

            if(p){

                g = p;
                break;

            }

        }

        if(g){

            const ax =
                g.axes || [];

            const x =
                ax[0] || 0;

            const y =
                ax[1] || 0;


            const left =
                !!(
                    g.buttons[14] &&
                    g.buttons[14].pressed
                ) ||
                x < -0.35;


            const right =
                !!(
                    g.buttons[15] &&
                    g.buttons[15].pressed
                ) ||
                x > 0.35;


            const up =
                !!(
                    g.buttons[12] &&
                    g.buttons[12].pressed
                ) ||
                y < -0.35;


            const down =
                !!(
                    g.buttons[13] &&
                    g.buttons[13].pressed
                ) ||
                y > 0.35;


            if(left !== padState.left){

                padState.left = left;

                key("ArrowLeft",left);

            }


            if(right !== padState.right){

                padState.right = right;

                key("ArrowRight",right);

            }


            if(up !== padState.up){

                padState.up = up;

                key("ArrowUp",up);

            }


            if(down !== padState.down){

                padState.down = down;

                key("ArrowDown",down);

            }

        }

    }catch(e){}

    requestAnimationFrame(updatePad);

}


/* --------------------------------------------------
   LOAD ROM
-------------------------------------------------- */

async function loadGame(){

    try{

        status.textContent =
            "Loading Super Mario Land...";


        const response =
            await fetch(
                "roms/Super%20Mario%20Land.gb"
            );


        if(!response.ok){

            throw new Error(
                "ROM not found (" +
                response.status +
                ")"
            );

        }


        const rom =
            await response.arrayBuffer();


        /*
            Create REAL Game Boy emulator.
        */

        gb =
            new GameboyJS.Gameboy(canvas);


        /*
            Find the ROM reader exposed
            by gameboy.js.
        */

        if(gb.loadRom){

            gb.loadRom(
                new Uint8Array(rom)
            );

        }else if(gb.loadROM){

            gb.loadROM(
                new Uint8Array(rom)
            );

        }else{

            /*
                The original emulator normally
                handles ROM loading through its
                RomFileReader.

                This message is intentional:
                we don't fake a successful load.
            */

            throw new Error(
                "ROM loader API not available"
            );

        }


        status.textContent =
            "Super Mario Land loaded!";


        setTimeout(
            function(){

                status.style.display =
                    "none";

            },
            2000
        );


    }catch(e){

        console.error(e);

        status.textContent =
            "ERROR: " + e.message;

    }

}


/* --------------------------------------------------
   BUTTONS
-------------------------------------------------- */

document.getElementById("reset")
.onclick = function(){

    location.reload();

};


document.getElementById("pause")
.onclick = function(){

    /*
       Keep this simple for the first test.
       We will connect the emulator pause
       properly after the ROM is confirmed.
    */

};


/* --------------------------------------------------
   START
-------------------------------------------------- */

requestAnimationFrame(updatePad);

loadGame();

</script>

</body>
</html>
