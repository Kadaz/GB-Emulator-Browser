<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Retro Land - PS5 Safari 17</title>

<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#111;
color:#e5efc8;
font-family:Arial,sans-serif;
touch-action:none;
}

#bar{
height:50px;
background:#1c2418;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 12px;
box-sizing:border-box;
}

button{
background:#293426;
color:#e5efc8;
border:1px solid #607052;
border-radius:6px;
padding:7px 11px;
font-weight:bold;
}

#stage{
height:calc(100% - 80px);
display:flex;
align-items:center;
justify-content:center;
}

canvas{
width:min(100%,960px);
height:auto;
max-height:100%;
image-rendering:pixelated;
image-rendering:crisp-edges;
background:#cbd99e;
border:8px solid #20271d;
box-sizing:border-box;
}

#hint{
text-align:center;
height:30px;
font-size:12px;
opacity:.8;
padding-top:7px;
box-sizing:border-box;
}

/* JUMP BUTTON */

#jumpBtn{
position:fixed;
right:28px;
bottom:48px;
width:105px;
height:65px;
border-radius:50%;
font-size:17px;
background:#38482f;
border:2px solid #91a978;
color:#eef6d5;
z-index:50;
touch-action:none;
-webkit-user-select:none;
user-select:none;
}

#jumpBtn:focus{
outline:3px solid #dce9b8;
outline-offset:3px;
}

#jumpBtn:active{
transform:scale(.94);
}

</style>
</head>

<body>

<div id="bar">

<b>RETRO LAND — GAME BOY STYLE</b>

<span>
<button id="pause">PAUSE</button>
<button id="reset">RESET</button>
<button id="sound">SOUND</button>
</span>

</div>

<div id="stage">

<canvas id="c" width="160" height="144" tabindex="0"></canvas>

</div>

<div id="hint">
DualSense: D-pad / Left Stick = Move · X = Jump · O = Dash · OPTIONS = Pause
</div>

<button id="jumpBtn" type="button">
JUMP
</button>


<script>

"use strict";


/* =========================================================
   GAME
========================================================= */

const c=document.getElementById("c");
const x=c.getContext("2d");

const W=160;
const H=144;

x.imageSmoothingEnabled=false;


/* =========================================================
   INPUT
========================================================= */

const k={
l:0,
r:0,
j:0,
d:0
};

let pause=0;
let win=0;
let sound=0;
let last=0;
let cam=0;
let opt=0;


/* =========================================================
   PLAYER
========================================================= */

const p={
x:20,
y:110,
w:12,
h:16,
vx:0,
vy:0,
g:0,
face:1,
coins:0,
lives:3,
_j:0,
_d:0
};


/* =========================================================
   LEVEL
========================================================= */

const solids=[

[0,142,500,18],
[540,142,330,18],
[910,142,460,18],
[1450,142,420,18],
[1940,142,460,18],

[180,116,48,8],
[300,94,42,8],
[610,112,50,8],
[720,84,46,8],

[1010,108,55,8],
[1110,78,44,8],
[1260,112,55,8],

[1510,112,44,8],
[1600,88,48,8],
[1760,112,46,8],

[2020,108,52,8],
[2130,80,44,8],
[2260,108,58,8]

];


const coins=[

[195,104],
[315,82],
[625,100],
[735,72],
[1025,96],
[1125,66],
[1275,100],
[1525,100],
[1615,76],
[1775,100],
[2035,96],
[2145,68],
[2275,96],
[455,125],
[850,125],
[1385,125],
[1875,125]

].map(q=>({

x:q[0],
y:q[1],
got:0

}));


const foes=[

[390,130,-.35],
[670,100,.3],
[1170,130,-.32],
[1660,130,.34],
[2190,130,-.35]

].map(q=>({

x:q[0],
y:q[1],
w:12,
h:12,
v:q[2],
alive:1

}));


const goal={
x:2350,
y:112,
w:18,
h:30
};


let msg="";


/* =========================================================
   COLLISION
========================================================= */

function hit(a,b){

return (

a.x<b[0]+b[2] &&
a.x+a.w>b[0] &&
a.y<b[1]+b[3] &&
a.y+a.h>b[1]

);

}


/* =========================================================
   SOUND
========================================================= */

function beep(f,t){

if(!sound)return;

try{

window.ac=
window.ac||
new(window.AudioContext||window.webkitAudioContext)();

let o=ac.createOscillator();
let g=ac.createGain();

o.frequency.value=f;
o.type="square";

g.gain.value=.035;

o.connect(g);
g.connect(ac.destination);

o.start();

g.gain.exponentialRampToValueAtTime(
.0001,
ac.currentTime+t
);

o.stop(ac.currentTime+t);

}catch(e){}

}


/* =========================================================
   RESET
========================================================= */

function reset(){

p.x=20;
p.y=110;

p.vx=0;
p.vy=0;

p.coins=0;
p.lives=3;

coins.forEach(q=>q.got=0);

foes.forEach(q=>q.alive=1);

cam=0;
win=0;
msg="";
pause=0;

}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

if(pause||win)return;


/* gravity */

p.vy+=.30*dt;


/* movement */

if(k.l){

p.vx-=.42*dt;
p.face=-1;

}

if(k.r){

p.vx+=.42*dt;
p.face=1;

}

p.vx*=Math.pow(.80,dt);

p.vx=Math.max(
-2.3,
Math.min(2.3,p.vx)
);


/* jump */

if(k.j&&!p._j){

if(p.g){

p.vy=-5.7;
p.g=0;

beep(620,.06);

}

p._j=1;

}

if(!k.j)
p._j=0;


/* dash */

if(k.d&&!p._d){

p.vx=p.face*3.8;

beep(180,.05);

p._d=1;

}

if(!k.d)
p._d=0;


/* horizontal collision */

let nx=p.x+p.vx*dt;

let ny=p.y+p.vy*dt;

let t={
x:nx,
y:p.y,
w:p.w,
h:p.h
};


for(const q of solids){

if(hit(t,q)){

if(p.vx>0)
nx=q[0]-p.w;

else if(p.vx<0)
nx=q[0]+q[2];

p.vx=0;

}

}


p.x=Math.max(
0,
Math.min(2388,nx)
);


/* vertical collision */

t={
x:p.x,
y:ny,
w:p.w,
h:p.h
};

p.g=0;


for(const q of solids){

if(hit(t,q)){

if(
p.vy>=0 &&
p.y+p.h<=q[1]+5
){

ny=q[1]-p.h;
p.vy=0;
p.g=1;

}

else if(
p.vy<0 &&
p.y>=q[1]+q[3]-4
){

ny=q[1]+q[3];
p.vy=0;

}

}

}


p.y=ny;


/* fall */

if(p.y>185){

p.lives--;

if(p.lives<1){

msg="GAME OVER - RESET";
pause=1;

}

else{

p.x=Math.max(
20,
p.x-150
);

p.y=100;
p.vx=0;
p.vy=0;

}

}


/* coins */

for(const q of coins){

if(
!q.got &&
p.x<q.x+7 &&
p.x+p.w>q.x &&
p.y<q.y+7 &&
p.y+p.h>q.y
){

q.got=1;
p.coins++;

beep(880,.05);

}

}


/* enemies */

for(const e of foes){

if(!e.alive)
continue;

e.x+=e.v*dt;

if(
e.x<0 ||
e.x>2388
)
e.v*=-1;


let z=

p.x<e.x+12 &&
p.x+p.w>e.x &&
p.y<e.y+12 &&
p.y+p.h>e.y;


if(z){

if(
p.vy>0 &&
p.y+p.h<e.y+8
){

e.alive=0;
p.vy=-3.8;

beep(120,.08);

}

else{

p.lives--;

p.x=Math.max(
20,
p.x-120
);

p.y=100;
p.vy=0;

beep(70,.12);

}

}

}


/* goal */

if(

p.x+p.w>goal.x &&
p.x<goal.x+goal.w &&
p.y+p.h>goal.y

){

win=1;
msg="STAGE CLEAR!";

beep(1000,.18);

}


/* camera */

cam=Math.max(
0,
Math.min(2080,p.x-105)
);

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

x.fillStyle="#cbd99e";

x.fillRect(
0,
0,
W,
H
);

x.save();

x.translate(
-cam,
0
);


/* sky */

x.fillStyle="#a9bb7b";

for(
let q=0;
q<2400;
q+=80
){

x.fillRect(
q,
40+(q%3)*4,
24,
2
);

x.fillRect(
q+8,
36+(q%3)*4,
6,
2
);

}


/* hills */

x.fillStyle="#9cad72";

for(
let q=-40;
q<2400;
q+=90
){

x.beginPath();

x.moveTo(q,142);
x.lineTo(q+40,96);
x.lineTo(q+80,142);

x.fill();

}


/* platforms */

for(const q of solids){

x.fillStyle="#26321f";

x.fillRect(
q[0],
q[1],
q[2],
q[3]
);

x.fillStyle="#657653";

x.fillRect(
q[0],
q[1],
q[2],
3
);

}


/* coins */

for(const q of coins){

if(!q.got){

x.fillStyle="#26321f";

x.fillRect(
q.x+2,
q.y,
3,
7
);

x.fillRect(
q.x,
q.y+2,
7,
3
);

x.fillStyle="#eef3c7";

x.fillRect(
q.x+2,
q.y+1,
3,
5
);

}

}


/* enemies */

for(const e of foes){

if(e.alive){

x.fillStyle="#26321f";

x.fillRect(
e.x,
e.y+3,
12,
8
);

x.fillRect(
e.x+2,
e.y,
8,
3
);

x.fillStyle="#dce8b8";

x.fillRect(
e.x+2,
e.y+5,
2,
2
);

x.fillRect(
e.x+8,
e.y+5,
2,
2
);

}

}


/* goal */

x.fillStyle="#26321f";

x.fillRect(
goal.x,
goal.y,
3,
30
);

x.fillRect(
goal.x+3,
goal.y,
15,
10
);

x.fillStyle="#c9d79d";

x.fillRect(
goal.x+6,
goal.y+3,
9,
4
);


/* player */

x.fillStyle="#1d281a";

x.fillRect(
p.x+3,
p.y,
7,
3
);

x.fillRect(
p.x+1,
p.y+3,
10,
5
);

x.fillRect(
p.x+3,
p.y+8,
7,
5
);

x.fillRect(
p.x,
p.y+13,
5,
3
);

x.fillRect(
p.x+8,
p.y+13,
5,
3
);

x.fillStyle="#dce8b8";

x.fillRect(
p.x+4,
p.y+4,
5,
2
);


x.restore();


/* HUD */

x.fillStyle="#1d281a";

x.fillRect(
0,
0,
W,
16
);

x.fillStyle="#e5efc8";

x.font="8px monospace";

x.fillText(
"RETRO LAND",
5,
10
);

x.fillText(
"COINS "+
String(p.coins).padStart(2,"0"),
85,
10
);

x.fillText(
"LIVES "+p.lives,
150,
10
);

x.fillText(
"WORLD 1-1",
205,
10
);


/* message */

if(msg){

x.fillStyle="rgba(20,28,17,.88)";

x.fillRect(
60,
63,
200,
34
);

x.fillStyle="#e5efc8";

x.font="bold 12px monospace";

x.textAlign="center";

x.fillText(
msg,
160,
84
);

x.textAlign="left";

}

}


/* =========================================================
   JUMP BUTTON
========================================================= */

const jumpBtn=
document.getElementById("jumpBtn");


function jumpButton(e){

if(e){

e.preventDefault();

e.stopPropagation();

}

k.j=1;

setTimeout(
function(){
k.j=0;
},
100
);

}


jumpBtn.addEventListener(
"pointerdown",
jumpButton,
{passive:false}
);

jumpBtn.addEventListener(
"click",
jumpButton,
{passive:false}
);


/* =========================================================
   KEYBOARD
========================================================= */

function gameKey(e){

let z=e.key.toLowerCase();


if(

z==="arrowleft" ||
z==="arrowright" ||
z==="arrowup" ||
z==="arrowdown" ||
z===" " ||
z==="a" ||
z==="d" ||
z==="w" ||
z==="z" ||
z==="x" ||
z==="shift"

){

e.preventDefault();

}


if(
z==="arrowleft" ||
z==="a"
)
k.l=1;


if(
z==="arrowright" ||
z==="d"
)
k.r=1;


if(
z==="arrowup" ||
z==="w" ||
z===" "
)
k.j=1;


if(
z==="z" ||
z==="x" ||
z==="shift"
)
k.d=1;


if(z==="escape"){

e.preventDefault();

pause=!pause;

}

}


function gameKeyUp(e){

let z=e.key.toLowerCase();


if(

z==="arrowleft" ||
z==="arrowright" ||
z==="arrowup" ||
z==="arrowdown" ||
z===" " ||
z==="a" ||
z==="d" ||
z==="w" ||
z==="z" ||
z==="x" ||
z==="shift"

){

e.preventDefault();

}


if(
z==="arrowleft" ||
z==="a"
)
k.l=0;


if(
z==="arrowright" ||
z==="d"
)
k.r=0;


if(
z==="arrowup" ||
z==="w" ||
z===" "
)
k.j=0;


if(
z==="z" ||
z==="x" ||
z==="shift"
)
k.d=0;

}


document.addEventListener(
"keydown",
gameKey,
{passive:false}
);

document.addEventListener(
"keyup",
gameKeyUp,
{passive:false}
);


/* =========================================================
   PAGE INPUT BLOCKING
========================================================= */

window.addEventListener(
"wheel",
function(e){
e.preventDefault();
},
{passive:false}
);

window.addEventListener(
"touchmove",
function(e){
e.preventDefault();
},
{passive:false}
);


/* =========================================================
   BUTTONS
========================================================= */

const pauseBtn=()=>pause=!pause;

document.getElementById(
"pause"
).onclick=pauseBtn;


document.getElementById(
"reset"
).onclick=reset;


document.getElementById(
"sound"
).onclick=function(){

sound=!sound;

document.getElementById(
"sound"
).textContent=
sound ? "SOUND ON" : "SOUND";

if(sound)
beep(700,.05);

};


/* =========================================================
   GAMEPAD
========================================================= */

function gp(){

try{

let pads=
navigator.getGamepads
?
navigator.getGamepads()
:
[];

let g=null;


for(
const z of pads
){

if(z){

g=z;
break;

}

}


if(g){

let ax=g.axes||[];


/*
   D-PAD
*/

k.l=
!!(
g.buttons[14] &&
g.buttons[14].pressed
)
||
(ax[0]||0)<-.35;


k.r=
!!(
g.buttons[15] &&
g.buttons[15].pressed
)
||
(ax[0]||0)>.35;


/*
   X button
   Standard Gamepad button 0
*/

k.j=!!(
g.buttons[0] &&
g.buttons[0].pressed
);


/*
   O button
   Standard Gamepad button 1
*/

k.d=!!(
g.buttons[1] &&
g.buttons[1].pressed
);


/*
   OPTIONS
*/

if(

g.buttons[9] &&
g.buttons[9].pressed &&
!opt

){

pause=!pause;

opt=1;

}

if(

g.buttons[9] &&
!g.buttons[9].pressed

){

opt=0;

}

}

}
catch(e){}


requestAnimationFrame(gp);

}


/* =========================================================
   GAME LOOP
========================================================= */

function loop(t){

let dt=
last
?
(t-last)/16.666
:
1;

last=t;

update(
Math.min(2,dt)
);

draw();

requestAnimationFrame(loop);

}


/* START */

requestAnimationFrame(gp);

requestAnimationFrame(loop);


/*
   Put focus on the JUMP button after loading.
   This gives the PS5 browser a clear selectable target.
*/

setTimeout(
function(){

try{
jumpBtn.focus();
}catch(e){}

},
300
);
/* =========================================================
   GAME BOY CPU — STEP 2
========================================================= */

class GBCPU{

constructor(){

this.a=0x01;
this.f=0xB0;

this.b=0x00;
this.c=0x13;

this.d=0x00;
this.e=0xD8;

this.h=0x01;
this.l=0x4D;

this.sp=0xFFFE;
this.pc=0x0100;

this.halted=false;
this.stopped=false;

this.ime=false;

}


/* ---------------------------------------------------------
   16-bit registers
--------------------------------------------------------- */

get af(){
return (this.a<<8)|this.f;
}

set af(v){
this.a=(v>>8)&255;
this.f=v&0xF0;
}


get bc(){
return (this.b<<8)|this.c;
}

set bc(v){
this.b=(v>>8)&255;
this.c=v&255;
}


get de(){
return (this.d<<8)|this.e;
}

set de(v){
this.d=(v>>8)&255;
this.e=v&255;
}


get hl(){
return (this.h<<8)|this.l;
}

set hl(v){
this.h=(v>>8)&255;
this.l=v&255;
}


/* ---------------------------------------------------------
   FLAGS
--------------------------------------------------------- */

get Z(){
return !!(this.f&0x80);
}

set Z(v){
if(v)this.f|=0x80;
else this.f&=~0x80;
}


get N(){
return !!(this.f&0x40);
}

set N(v){
if(v)this.f|=0x40;
else this.f&=~0x40;
}


get H(){
return !!(this.f&0x20);
}

set H(v){
if(v)this.f|=0x20;
else this.f&=~0x20;
}


get CARRY(){
return !!(this.f&0x10);
}

set CARRY(v){
if(v)this.f|=0x10;
else this.f&=~0x10;
}


/* ---------------------------------------------------------
   MEMORY
--------------------------------------------------------- */

read(addr){

addr&=0xFFFF;

if(this.mem)
return this.mem[addr]&255;

return 0xFF;

}


write(addr,value){

addr&=0xFFFF;
value&=255;

if(this.mem)
this.mem[addr]=value;

}


/* ---------------------------------------------------------
   FETCH
--------------------------------------------------------- */

fetch8(){

let v=this.read(this.pc);

this.pc=(this.pc+1)&0xFFFF;

return v;

}


fetch16(){

let lo=this.fetch8();
let hi=this.fetch8();

return lo|(hi<<8);

}


/* ---------------------------------------------------------
   STACK
--------------------------------------------------------- */

push16(v){

this.sp=(this.sp-1)&0xFFFF;
this.write(this.sp,(v>>8)&255);

this.sp=(this.sp-1)&0xFFFF;
this.write(this.sp,v&255);

}


pop16(){

let lo=this.read(this.sp);
this.sp=(this.sp+1)&0xFFFF;

let hi=this.read(this.sp);
this.sp=(this.sp+1)&0xFFFF;

return lo|(hi<<8);

}


/* ---------------------------------------------------------
   CPU RESET
--------------------------------------------------------- */

reset(){

this.a=0x01;
this.f=0xB0;

this.b=0x00;
this.c=0x13;

this.d=0x00;
this.e=0xD8;

this.h=0x01;
this.l=0x4D;

this.sp=0xFFFE;
this.pc=0x0100;

this.halted=false;
this.stopped=false;

this.ime=false;

}


/* ---------------------------------------------------------
   NOP
--------------------------------------------------------- */

nop(){

return 4;

}


/* ---------------------------------------------------------
   CPU STEP
--------------------------------------------------------- */

/* ---------------------------------------------------------
   CPU STEP — REAL GAME BOY INSTRUCTIONS
--------------------------------------------------------- */

step(){

if(this.halted)
return 4;

if(this.stopped)
return 4;


const op=this.fetch8();


/* =========================================================
   8-BIT REGISTER ACCESS
========================================================= */

const getR=(n)=>{

switch(n){

case 0:return this.b;
case 1:return this.c;
case 2:return this.d;
case 3:return this.e;
case 4:return this.h;
case 5:return this.l;

case 6:
return this.read(this.hl);

case 7:return this.a;

}

return 0;

};


const setR=(n,v)=>{

v&=255;

switch(n){

case 0:this.b=v;break;
case 1:this.c=v;break;
case 2:this.d=v;break;
case 3:this.e=v;break;
case 4:this.h=v;break;
case 5:this.l=v;break;

case 6:
this.write(this.hl,v);
break;

case 7:
this.a=v;
break;

}

};


/* =========================================================
   INC 8-BIT
========================================================= */

const inc8=(v)=>{

const old=v&255;

v=(v+1)&255;

this.Z=(v===0);
this.N=0;
this.H=((old&15)+1)>15;

return v;

};


/* =========================================================
   DEC 8-BIT
========================================================= */

const dec8=(v)=>{

const old=v&255;

v=(v-1)&255;

this.Z=(v===0);
this.N=1;
this.H=(old&15)===0;

return v;

};


/* =========================================================
   ADD A,r
========================================================= */

const addA=(v)=>{

v&=255;

const a=this.a;

const result=a+v;

/* =========================================================
   GAME BOY MEMORY SYSTEM — STEP 5
========================================================= */

const gbMemory=new Uint8Array(0x10000);
/* =========================================================
   GAME BOY TIMER
========================================================= */

const gbTimer={
  div:0,
  tima:0,
  tma:0,
  tac:0,
  counter:0
};
function gbTimerStep(cycles){

  gbTimer.div=
    (gbTimer.div + cycles) & 0xFFFF;


  if(!(gbTimer.tac & 0x04))
    return;


  gbTimer.counter+=cycles;


  const frequencies=[
    1024,
    16,
    64,
    256
  ];


  const threshold=
    frequencies[gbTimer.tac & 0x03];


  while(gbTimer.counter>=threshold){

    gbTimer.counter-=threshold;


    if(gbTimer.tima===0xFF){

      gbTimer.tima=gbTimer.tma;

      gbMemory[0xFF0F]|=0x04;

    }
    else{

      gbTimer.tima++;

    }

  }

}
   
/* =========================================================
   GAME BOY CARTRIDGE
========================================================= */

const gbCartridge={

rom:null,

romSize:0,

ram:new Uint8Array(0x2000),

romBank:1,

ramBank:0,

mbcType:0,

ramEnabled:false

};


/* =========================================================
   CARTRIDGE HEADER
========================================================= */

function gbDetectCartridge(){

if(!gbCartridge.rom)
return;


/*
   Cartridge type
   $0147
*/

gbCartridge.mbcType=
gbCartridge.rom[0x0147]||0;


/*
   ROM size
   $0148
*/

const romSizeCode=
gbCartridge.rom[0x0148]||0;


/*
   Calculate actual ROM size.
*/

if(romSizeCode<=8){

gbCartridge.romSize=
32768*(1<<romSizeCode);

}
else{

gbCartridge.romSize=
gbCartridge.rom.length;

}


console.log(
"Game Boy cartridge type:",
"0x"+
gbCartridge.mbcType
.toString(16)
.padStart(2,"0")
);


console.log(
"Game Boy cartridge ROM:",
gbCartridge.romSize,
"bytes"
);

}


/* =========================================================
   ROM READ
========================================================= */

function gbReadROM(addr){

addr&=0xFFFF;


if(!gbCartridge.rom)
return 0xFF;


/*
   ROM Bank 0
*/

if(addr<0x4000){

if(addr<gbCartridge.rom.length)
return gbCartridge.rom[addr];

return 0xFF;

}


/*
   Switchable ROM bank
*/

if(addr<0x8000){

let bank=gbCartridge.romBank;


/*
   Avoid bank zero in switchable area.
*/

if(bank===0)
bank=1;


const index=
bank*0x4000+
(addr-0x4000);


if(index<gbCartridge.rom.length)
return gbCartridge.rom[index];

return 0xFF;

}


return 0xFF;

}


/* =========================================================
   MEMORY READ
========================================================= */

function gbRead(addr){

addr&=0xFFFF;

   /*
   Timer registers
*/

if(addr===0xFF04){

  return (gbTimer.div>>8)&0xFF;

}

if(addr===0xFF05){

  return gbTimer.tima;

}

if(addr===0xFF06){

  return gbTimer.tma;

}

if(addr===0xFF07){

  return gbTimer.tac|0xF8;
   /*
   Interrupt Flag
*/

if(addr===0xFF0F){

  return gbMemory[0xFF0F];

}


/*
   Interrupt Enable
*/

if(addr===0xFFFF){

  return gbMemory[0xFFFF];

}

}

/*
   Cartridge ROM
*/

if(addr<0x8000){

return gbReadROM(addr);

}


/*
   Cartridge RAM
*/

if(
addr>=0xA000 &&
addr<0xC000
){

if(!gbCartridge.ramEnabled)
return 0xFF;

return gbCartridge.ram[
gbCartridge.ramBank*0x2000+
(addr-0xA000)
];

}


/*
   Echo RAM

   $E000-$FDFF mirrors
   $C000-$DDFF
*/

if(
addr>=0xE000 &&
addr<0xFE00
){

return gbMemory[
addr-0x2000
];

}


/*
   Unusable area
*/

if(
addr>=0xFEA0 &&
addr<0xFF00
){

return 0xFF;

}


/*
   Everything else
*/

return gbMemory[addr];

}


/* =========================================================
   MEMORY WRITE
========================================================= */

function gbWrite(addr,value){
   

addr&=0xFFFF;
value&=0xFF;
   /*
   Timer registers
*/

if(addr===0xFF04){

  gbTimer.div=0;

  return;

}

if(addr===0xFF05){

  gbTimer.tima=value;

  return;

}

if(addr===0xFF06){

  gbTimer.tma=value;

  return;

}

if(addr===0xFF07){

  gbTimer.tac=value&0x07;

  return;

}
   /*
   Interrupt Flag
*/

if(addr===0xFF0F){

  gbMemory[0xFF0F]=value;

  return;

}


/*
   Interrupt Enable
*/

if(addr===0xFFFF){

  gbMemory[0xFFFF]=value;

  return;

}


/*
   Cartridge control area
*/

if(addr<0x8000){

/*
   For now we support the
   simplest cartridge mapping.

   MBC support will be expanded
   later when needed.
*/

if(
gbCartridge.mbcType===0
){

return;

}


/*
   MBC1 RAM enable
*/

if(addr<0x2000){

gbCartridge.ramEnabled=
(value&0x0F)===0x0A;

return;

}


/*
   MBC1 ROM bank select
*/

if(
addr>=0x2000 &&
addr<0x4000
){

let bank=value&0x1F;

if(bank===0)
bank=1;

gbCartridge.romBank=bank;

return;

}

return;

}


/*
   Cartridge RAM
*/

if(
addr>=0xA000 &&
addr<0xC000
){

if(!gbCartridge.ramEnabled)
return;

gbCartridge.ram[
gbCartridge.ramBank*0x2000+
(addr-0xA000)
]=value;

return;

}


/*
   Echo RAM
*/

if(
addr>=0xE000 &&
addr<0xFE00
){

gbMemory[
addr-0x2000
]=value;

return;

}


/*
   Unusable area
*/

if(
addr>=0xFEA0 &&
addr<0xFF00
){

return;

}


/*
   Normal RAM / I/O
*/

gbMemory[addr]=value;

}


/* =========================================================
   CPU MEMORY CONNECTION
========================================================= */

const gbCPU=new GBCPU();


/*
   The CPU now uses the Game Boy
   memory system instead of directly
   accessing the raw 64 KB array.
*/

gbCPU.read=function(addr){

return gbRead(addr);

};


gbCPU.write=function(addr,value){

gbWrite(addr,value);

};

   ROM LOADER
========================================================= */

const GB_ROM_PATH=
"roms/Super Mario Land.gb";


let gbROM=null;
let gbROMLoaded=false;


async function loadGBROM(){

try{

const response=
await fetch(
GB_ROM_PATH,
{
cache:"no-store"
}
);


if(!response.ok){

throw new Error(
"HTTP "+response.status
);

}


const buffer=
await response.arrayBuffer();


gbROM=
new Uint8Array(buffer);


gbCartridge.rom=
gbROM;


gbCartridge.romSize=
gbROM.length;


/*
   Read cartridge header.
*/

gbDetectCartridge();


gbROMLoaded=true;


console.log(
"Game Boy ROM loaded:",
GB_ROM_PATH
);


console.log(
"ROM size:",
gbROM.length,
"bytes"
);


/*
   First instruction at $0100.
*/

console.log(
"Entry opcode:",
"0x"+
gbRead(0x0100)
.toString(16)
.padStart(2,"0")
);


/*
   Cartridge title.

   Header $0134-$0143.
*/

let title="";

for(
let i=0x0134;
i<=0x0143;
i++
){

const ch=gbROM[i];

if(
ch>=32 &&
ch<=126
){

title+=String.fromCharCode(ch);

}

}


console.log(
"Cartridge title:",
title.trim()
);


}
catch(e){

gbROMLoaded=false;

console.error(
"Game Boy ROM loading failed:",
e
);

}

}


loadGBROM();

{

);

);

);

i++
){

gbCPU.mem[i]=gbROM[i];

}


gbROMLoaded=true;

console.log(
"Game Boy ROM loaded:",
GB_ROM_PATH
);

console.log(
"ROM size:",
gbROM.length,
"bytes"
);

console.log(
"Entry point:",
gbCPU.mem[0x0100].toString(16)
);


}
catch(e){

gbROMLoaded=false;

console.error(
"Game Boy ROM loading failed:",
e
);

}

}


/* ---------------------------------------------------------
   START ROM LOADING
--------------------------------------------------------- */

loadGBROM();

*/

gbCPU.mem[0x0100]=0x00;

gbCPU.step();


/*

*/

console.log(

gbCPU.pc===0x0101
?
