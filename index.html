/* =========================================================
   GAME BOY JOYPAD
========================================================= */

const gbJoypad={
A:0,
B:0,
SELECT:0,
START:0,
UP:0,
DOWN:0,
LEFT:0,
RIGHT:0,

selectButtons:1,
selectDpad:1
};


function gbJoypadRead(){

let value=0xCF;


/*
   Bit 5 = 0 -> buttons selected
   Bit 4 = 0 -> D-pad selected
*/

if(gbJoypad.selectButtons){

value|=0x20;

}
else{

value&=~0x20;

if(gbJoypad.A)
value&=~0x01;

if(gbJoypad.B)
value&=~0x02;

if(gbJoypad.SELECT)
value&=~0x04;

if(gbJoypad.START)
value&=~0x08;

}


if(gbJoypad.selectDpad){

value|=0x10;

}
else{

value&=~0x10;

if(gbJoypad.RIGHT)
value&=~0x01;

if(gbJoypad.LEFT)
value&=~0x02;

if(gbJoypad.UP)
value&=~0x04;

if(gbJoypad.DOWN)
value&=~0x08;

}


return value&0xFF;

}

vy:0,

const solids=[

/* =========================================================
   COLLISION
========================================================= */

function hit(a,b){

return(
a.x<b[0]+b[2] &&
a.x+a.w>b[0] &&
a.y<b[1]+b[3] &&
a.y+a.h>b[1]
);

}


/* =========================================================
   SOUND
========================================================= */

function beep(f,t){

if(!sound)return;

try{

window.ac=
window.ac||
new(window.AudioContext||window.webkitAudioContext)();

let o=ac.createOscillator();
let g=ac.createGain();

o.frequency.value=f;
o.type="square";

g.gain.value=.035;

o.connect(g);
g.connect(ac.destination);

o.start();

g.gain.exponentialRampToValueAtTime(
.0001,
ac.currentTime+t
);

o.stop(ac.currentTime+t);

}catch(e){}

}


/* =========================================================
   RESET
========================================================= */

function reset(){

p.x=20;
p.y=110;

p.vx=0;
p.vy=0;

p.coins=0;
p.lives=3;

coins.forEach(q=>q.got=0);
foes.forEach(q=>q.alive=1);

cam=0;
win=0;
msg="";

}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

if(pause||win)return;

p.vy+=.30*dt;


if(k.l){

p.vx-=.42*dt;
p.face=-1;

}

if(k.r){

p.vx+=.42*dt;
p.face=1;

}

p.vx*=Math.pow(.80,dt);

p.vx=Math.max(
-2.3,
Math.min(2.3,p.vx)
);


if(k.j&&!p._j){

if(p.g){

p.vy=-5.7;
p.g=0;

beep(620,.06);

}

p._j=1;

}

if(!k.j)
p._j=0;


if(k.d&&!p._d){

p.vx=p.face*3.8;

beep(180,.05);

p._d=1;

}

if(!k.d)
p._d=0;


let nx=p.x+p.vx*dt;
let ny=p.y+p.vy*dt;

let t={
x:nx,
y:p.y,
w:p.w,
h:p.h
};


for(const q of solids){

if(hit(t,q)){

if(p.vx>0)
nx=q[0]-p.w;

else if(p.vx<0)
nx=q[0]+q[2];

p.vx=0;

}

}


p.x=Math.max(
0,
Math.min(2388,nx)
);


t={
x:p.x,
y:ny,
w:p.w,
h:p.h
};

p.g=0;


for(const q of solids){

if(hit(t,q)){

if(
p.vy>=0 &&
p.y+p.h<=q[1]+5
){

ny=q[1]-p.h;
p.vy=0;
p.g=1;

}

else if(
p.vy<0 &&
p.y>=q[1]+q[3]-4
){

ny=q[1]+q[3];
p.vy=0;

}

}

}


p.y=ny;


if(p.y>185){

p.lives--;

if(p.lives<1){

msg="GAME OVER - RESET";
pause=1;

}

else{

p.x=Math.max(
20,
p.x-150
);

p.y=100;
p.vx=0;
p.vy=0;

}

}


for(const q of coins){

if(
!q.got &&
p.x<q.x+7 &&
p.x+p.w>q.x &&
p.y<q.y+7 &&
p.y+p.h>q.y
){

q.got=1;
p.coins++;

beep(880,.05);

}

}


for(const e of foes){

if(!e.alive)
continue;

e.x+=e.v*dt;

if(
e.x<0 ||
e.x>2388
)
e.v*=-1;


let z=
p.x<e.x+12 &&
p.x+p.w>e.x &&
p.y<e.y+12 &&
p.y+p.h>e.y;


if(z){

if(
p.vy>0 &&
p.y+p.h<e.y+8
){

e.alive=0;
p.vy=-3.8;

beep(120,.08);

}

else{

p.lives--;

p.x=Math.max(
20,
p.x-120
);

p.y=100;
p.vy=0;

beep(70,.12);

}

}

}


if(
p.x+p.w>goal.x &&
p.x<goal.x+goal.w &&
p.y+p.h>goal.y
){

win=1;
msg="STAGE CLEAR!";

beep(1000,.18);

}


cam=Math.max(
0,
Math.min(2080,p.x-105)
);

}

/* =========================================================
   GAMEPAD
========================================================= */

function gp(){

try{

let pads=navigator.getGamepads?navigator.getGamepads():[];
let g=null;

for(const z of pads){

if(z){

g=z;
break;

}

}

if(g){

let ax=g.axes||[];


/* D-PAD */

let left=false;
let right=false;
let up=false;
let down=false;


/* Standard D-pad */

if(g.buttons[12]&&g.buttons[12].pressed)
up=true;

if(g.buttons[13]&&g.buttons[13].pressed)
down=true;

if(g.buttons[14]&&g.buttons[14].pressed)
left=true;

if(g.buttons[15]&&g.buttons[15].pressed)
right=true;


/* Left stick */

if((ax[0]||0)<-.35)
left=true;

if((ax[0]||0)>.35)
right=true;

if((ax[1]||0)<-.35)
up=true;

if((ax[1]||0)>.35)
down=true;


/* DualSense D-pad axis */

if(Number.isFinite(ax[9])){

let v=ax[9];

if(Math.abs(v+1.000)<0.12){
up=true;
}

if(Math.abs(v-0.14286)<0.12){
down=true;
}

if(Math.abs(v-0.71429)<0.12){
left=true;
}

if(Math.abs(v+0.42857)<0.12){
right=true;
}

if(Math.abs(v+0.71429)<0.12){
up=true;
right=true;
}

if(Math.abs(v+0.14286)<0.12){
down=true;
right=true;
}

if(Math.abs(v-0.42857)<0.12){
left=true;
down=true;
}

if(Math.abs(v-1.000)<0.12){
left=true;
up=true;
}

}


/* FAKE GAME */

k.l=left?1:0;
k.r=right?1:0;


/* GAME BOY D-PAD */

gbJoypad.LEFT=left?1:0;
gbJoypad.RIGHT=right?1:0;
gbJoypad.UP=up?1:0;
gbJoypad.DOWN=down?1:0;


/* X = A / JUMP */

k.j=
g.buttons[0]&&g.buttons[0].pressed
?
1
:
0;

gbJoypad.A=k.j;


/* O = B / DASH */

k.d=
g.buttons[1]&&g.buttons[1].pressed
?
1
:
0;

gbJoypad.B=k.d;


/* OPTIONS = PAUSE */

let options=
g.buttons[9]&&g.buttons[9].pressed;

if(options&&!opt){

pause=!pause;
opt=1;

}

if(!options){

opt=0;

}

}

}
catch(e){}

requestAnimationFrame(gp);

}

/* =========================================================
   MBC1
========================================================= */

function gbMBC1ROMBank(){

if(gbCartridge.mbcType!==1)
return 1;

let bank=
gbCartridge.romBank&0x1F;

if(bank===0)
bank=1;

if(gbCartridge.bankingMode===0){

bank|=
(gbCartridge.ramBank&3)<<5;

}

return bank;

}


function gbMBC1RAMBank(){

if(gbCartridge.bankingMode===0)
return 0;

return gbCartridge.ramBank&3;

}


/* =========================================================
   ROM READ
========================================================= */

function gbReadROM(addr){

addr&=0xFFFF;

if(!gbCartridge.rom)
return 0xFF;


if(addr<0x4000){

let bank=0;

if(
gbCartridge.mbcType===1 &&
gbCartridge.bankingMode===0
){

bank=(gbCartridge.ramBank&3)<<5;

}


const index=
bank*0x4000+addr;

if(index<gbCartridge.rom.length)
return gbCartridge.rom[index];

return 0xFF;

}


if(addr<0x8000){

const bank=
gbMBC1ROMBank();

const index=
bank*0x4000+
(addr-0x4000);

if(index<gbCartridge.rom.length)
return gbCartridge.rom[index];

return 0xFF;

}


return 0xFF;

}


/* =========================================================
   MEMORY READ
========================================================= */

function gbRead(addr){

addr&=0xFFFF;


/* ROM */

if(addr<0x8000){

return gbReadROM(addr);

}


/* VRAM */

if(
addr>=0x8000 &&
addr<=0x9FFF
){

return gbVRAM[
addr-0x8000
];

}


/* CARTRIDGE RAM */

if(
addr>=0xA000 &&
addr<0xC000
){

if(!gbCartridge.ramEnabled)
return 0xFF;

const bank=
gbMBC1RAMBank();

return gbCartridge.ram[
bank*0x2000+
(addr-0xA000)
];

}


/* WRAM */

if(
addr>=0xC000 &&
addr<0xE000
){

return gbMemory[addr];

}


/* ECHO */

if(
addr>=0xE000 &&
addr<0xFE00
){

return gbMemory[
addr-0x2000
];

}


/* OAM */

if(
addr>=0xFE00 &&
addr<=0xFE9F
){

return gbOAM[
addr-0xFE00
];

}


/* UNUSABLE */

if(
addr>=0xFEA0 &&
addr<0xFF00
){

return 0xFF;

}


/* JOYPAD */

if(addr===0xFF00){

return gbJoypadRead();

}


/* TIMER */

if(addr===0xFF04){

return(
gbTimer.div>>8
)&0xFF;

}

if(addr===0xFF05){

return gbTimer.tima;

}

if(addr===0xFF06){

return gbTimer.tma;

}

if(addr===0xFF07){

return gbTimer.tac|0xF8;

}


/* IF */

if(addr===0xFF0F){

return gbMemory[0xFF0F];

}


/* PPU */

if(addr===0xFF40)
return gbPPU.lcdc;

if(addr===0xFF41)
return(
gbPPU.stat|
0x80
);

if(addr===0xFF42)
return gbPPU.scy;

if(addr===0xFF43)
return gbPPU.scx;

if(addr===0xFF44)
return gbPPU.ly;

if(addr===0xFF45)
return gbPPU.lyc;

if(addr===0xFF47)
return gbPPU.bgp;

if(addr===0xFF48)
return gbPPU.obp0;

if(addr===0xFF49)
return gbPPU.obp1;

if(addr===0xFF4A)
return gbPPU.wy;

if(addr===0xFF4B)
return gbPPU.wx;


/* IE */

if(addr===0xFFFF){

return gbMemory[0xFFFF];

}


/* NORMAL RAM */

return gbMemory[addr];

}


/* =========================================================
   OAM DMA
========================================================= */

function gbDMA(value){

const source=
(value&0xFF)<<8;

for(let i=0;i<0xA0;i++){

gbOAM[i]=
gbRead(
(source+i)&0xFFFF
);

}

}


/* =========================================================
   MEMORY WRITE
========================================================= */

function gbWrite(addr,value){

addr&=0xFFFF;
value&=0xFF;


/* MBC */

if(addr<0x8000){

if(gbCartridge.mbcType===1){

if(addr<0x2000){

gbCartridge.ramEnabled=
(value&0x0F)===0x0A;

return;

}


if(addr<0x4000){

let bank=
value&0x1F;

if(bank===0)
bank=1;

gbCartridge.romBank=
bank&0x1F;

return;

}


if(addr<0x6000){

gbCartridge.ramBank=
value&0x03;

return;

}


if(addr<0x8000){

gbCartridge.bankingMode=
value&1;

return;

}

}

return;

}


/* VRAM */

if(
addr>=0x8000 &&
addr<=0x9FFF
){

gbVRAM[
addr-0x8000
]=value;

return;

}


/* CARTRIDGE RAM */

if(
addr>=0xA000 &&
addr<0xC000
){

if(!gbCartridge.ramEnabled)
return;

const bank=
gbMBC1RAMBank();

gbCartridge.ram[
bank*0x2000+
(addr-0xA000)
]=value;

return;

}


/* WRAM */

if(
addr>=0xC000 &&
addr<0xE000
){

gbMemory[addr]=value;

return;

}


/* ECHO */

if(
addr>=0xE000 &&
addr<0xFE00
){

gbMemory[
addr-0x2000
]=value;

return;

}


/* OAM */

if(
addr>=0xFE00 &&
addr<=0xFE9F
){

gbOAM[
addr-0xFE00
]=value;

return;

}


/* UNUSABLE */

if(
addr>=0xFEA0 &&
addr<0xFF00
){

return;

}


/* JOYPAD */

if(addr===0xFF00){

gbJoypad.selectButtons=
!!(value&0x20);

gbJoypad.selectDpad=
!!(value&0x10);

gbMemory[0xFF00]=
(value&0x30)|0xCF;

return;

}


/* DIV */

if(addr===0xFF04){

gbTimer.div=0;

return;

}


/* TIMER */

if(addr===0xFF05){

gbTimer.tima=value;

return;

}

if(addr===0xFF06){

gbTimer.tma=value;

return;

}

if(addr===0xFF07){

gbTimer.tac=value&7;

return;

}


/* IF */

if(addr===0xFF0F){

gbMemory[0xFF0F]=
value|0xE0;

return;

}


/* PPU */

if(addr===0xFF40){

gbPPU.lcdc=value;

return;

}

if(addr===0xFF41){

gbPPU.stat=
(value&0x78)|
(gbPPU.stat&0x07)|
0x80;

return;

}

if(addr===0xFF42){

gbPPU.scy=value;

return;

}

if(addr===0xFF43){

gbPPU.scx=value;

return;

}


/* LY is read-only */

if(addr===0xFF44){

gbPPU.ly=0;

return;

}

if(addr===0xFF45){

gbPPU.lyc=value;

return;

}

if(addr===0xFF46){

gbDMA(value);

return;

}

if(addr===0xFF47){

gbPPU.bgp=value;

return;

}

if(addr===0xFF48){

gbPPU.obp0=value;

return;

}

if(addr===0xFF49){

gbPPU.obp1=value;

return;

}

if(addr===0xFF4A){

gbPPU.wy=value;

return;

}

if(addr===0xFF4B){

gbPPU.wx=value;

return;

}


/* IE */

if(addr===0xFFFF){

gbMemory[0xFFFF]=value;

return;

}


/* NORMAL MEMORY */

gbMemory[addr]=value;

}


/* =========================================================
   HARDWARE RESET
========================================================= */

function gbHardwareReset(){

gbMemory.fill(0);
gbVRAM.fill(0);
gbOAM.fill(0);

gbCartridge.ram.fill(0);

gbTimer.div=0;
gbTimer.tima=0;
gbTimer.tma=0;
gbTimer.tac=0;
gbTimer.counter=0;

gbPPU.lcdc=0x91;
gbPPU.stat=0x85;
gbPPU.scy=0;
gbPPU.scx=0;
gbPPU.lyc=0;
gbPPU.bgp=0xFC;
gbPPU.obp0=0xFF;
gbPPU.obp1=0xFF;
gbPPU.wy=0;
gbPPU.wx=0;
gbPPU.ly=0;
gbPPU.cycles=0;
gbPPU.mode=2;


/* JOYPAD RESET */

gbJoypad.A=0;
gbJoypad.B=0;
gbJoypad.SELECT=0;
gbJoypad.START=0;
gbJoypad.UP=0;
gbJoypad.DOWN=0;
gbJoypad.LEFT=0;
gbJoypad.RIGHT=0;

gbJoypad.selectButtons=1;
gbJoypad.selectDpad=1;


gbMemory[0xFF00]=0xCF;
gbMemory[0xFF0F]=0xE1;
gbMemory[0xFF40]=0x91;
gbMemory[0xFF41]=0x85;
gbMemory[0xFF47]=0xFC;
gbMemory[0xFF48]=0xFF;
gbMemory[0xFF49]=0xFF;
gbMemory[0xFFFF]=0x00;

}


/* =========================================================
   GAME BOY CPU
========================================================= */

class GBCPU{

constructor(){

this.mem=null;

this.a=0x01;
this.f=0xB0;

this.b=0x00;
this.c=0x13;

this.d=0x00;
this.e=0xD8;

this.h=0x01;
this.l=0x4D;

this.sp=0xFFFE;
this.pc=0x0100;

this.halted=false;
this.stopped=false;

this.ime=false;
this.imeDelay=0;

}


get af(){
return(
(this.a<<8)|
(this.f&0xF0)
);
}


set af(v){

this.a=
(v>>8)&0xFF;

this.f=
v&0xF0;

}


get bc(){
return(
(this.b<<8)|
this.c
);
}


set bc(v){

this.b=
(v>>8)&0xFF;

this.c=
v&0xFF;

}


get de(){
return(
(this.d<<8)|
this.e
);
}


set de(v){

this.d=
(v>>8)&0xFF;

this.e=
v&0xFF;

}


get hl(){
return(
(this.h<<8)|
this.l
);
}


set hl(v){

this.h=
(v>>8)&0xFF;

this.l=
v&0xFF;

}


get Z(){
return !!(this.f&0x80);
}

set Z(v){

if(v)
this.f|=0x80;
else
this.f&=~0x80;

}


get N(){
return !!(this.f&0x40);
}

set N(v){

if(v)
this.f|=0x40;
else
this.f&=~0x40;

}


get H(){
return !!(this.f&0x20);
}

set H(v){

if(v)
this.f|=0x20;
else
this.f&=~0x20;

}


get CARRY(){
return !!(this.f&0x10);
}

set CARRY(v){

if(v)
this.f|=0x10;
else
this.f&=~0x10;

}


read(addr){

return gbRead(addr);

}


write(addr,value){

gbWrite(addr,value);

}


fetch8(){

const v=
this.read(this.pc);

this.pc=
(this.pc+1)&0xFFFF;

return v;

}


fetch16(){

const lo=this.fetch8();
const hi=this.fetch8();

return lo|(hi<<8);

}


push16(v){

this.sp=
(this.sp-1)&0xFFFF;

this.write(
this.sp,
(v>>8)&0xFF
);

this.sp=
(this.sp-1)&0xFFFF;

this.write(
this.sp,
v&0xFF
);

}


pop16(){

const lo=
this.read(this.sp);

this.sp=
(this.sp+1)&0xFFFF;

const hi=
this.read(this.sp);

this.sp=
(this.sp+1)&0xFFFF;

return lo|(hi<<8);

}


reset(){

this.a=0x01;
this.f=0xB0;

this.b=0x00;
this.c=0x13;

this.d=0x00;
this.e=0xD8;

this.h=0x01;
this.l=0x4D;

this.sp=0xFFFE;
this.pc=0x0100;

this.halted=false;
this.stopped=false;

this.ime=false;
this.imeDelay=0;

}


serviceInterrupts(){

const ie=
this.read(0xFFFF);

const iff=
this.read(0xFF0F);

const pending=
ie&iff&0x1F;


if(!pending)
return 0;


if(this.halted){

this.halted=false;

}


if(!this.ime)
return 0;


let vector=0;
let mask=0;


if(pending&0x01){

vector=0x40;
mask=0x01;

}
else if(pending&0x02){

vector=0x48;
mask=0x02;

}
else if(pending&0x04){

vector=0x50;
mask=0x04;

}
else if(pending&0x08){

vector=0x58;
mask=0x08;

}
else if(pending&0x10){

vector=0x60;
mask=0x10;

}


if(!vector)
return 0;


this.write(
0xFF0F,
this.read(0xFF0F)&~mask
);

this.ime=false;

this.push16(this.pc);

this.pc=vector;

return 20;

}


step(){

const interruptCycles=
this.serviceInterrupts();

if(interruptCycles)
return interruptCycles;


if(this.stopped)
return 4;


if(this.halted)
return 4;


const op=this.fetch8();


const getR=(n)=>{

switch(n){

case 0:return this.b;
case 1:return this.c;
case 2:return this.d;
case 3:return this.e;
case 4:return this.h;
case 5:return this.l;
case 6:return this.read(this.hl);
case 7:return this.a;

}

return 0;

};


const setR=(n,v)=>{

v&=0xFF;

switch(n){

case 0:this.b=v;break;
case 1:this.c=v;break;
case 2:this.d=v;break;
case 3:this.e=v;break;
case 4:this.h=v;break;
case 5:this.l=v;break;
case 6:this.write(this.hl,v);break;
case 7:this.a=v;break;

}

};


const inc8=(v)=>{

const old=v&0xFF;

v=(v+1)&0xFF;

this.Z=v===0;
this.N=0;
this.H=((old&0x0F)+1)>0x0F;

return v;

};


const dec8=(v)=>{

const old=v&0xFF;

v=(v-1)&0xFF;

this.Z=v===0;
this.N=1;
this.H=(old&0x0F)===0;

return v;

};


const addA=(v)=>{

v&=0xFF;

const a=this.a;
const result=a+v;

this.a=result&0xFF;

this.Z=this.a===0;
this.N=0;
this.H=((a&15)+(v&15))>15;
this.CARRY=result>255;

};


const adcA=(v)=>{

v&=0xFF;

const carry=this.CARRY?1:0;
const a=this.a;
const result=a+v+carry;

this.a=result&0xFF;

this.Z=this.a===0;
this.N=0;
this.H=((a&15)+(v&15)+carry)>15;
this.CARRY=result>255;

};


const subA=(v)=>{

v&=0xFF;

const a=this.a;
const result=a-v;

this.a=result&0xFF;

this.Z=this.a===0;
this.N=1;
this.H=(a&15)<(v&15);
this.CARRY=a<v;

};


const sbcA=(v)=>{

v&=0xFF;

const carry=this.CARRY?1:0;
const a=this.a;
const result=a-v-carry;

this.a=result&0xFF;

this.Z=this.a===0;
this.N=1;
this.H=((a&15)-(v&15)-carry)<0;
this.CARRY=result<0;

};


const cpA=(v)=>{

v&=0xFF;

const a=this.a;
const result=a-v;

this.Z=(result&0xFF)===0;
this.N=1;
this.H=(a&15)<(v&15);
this.CARRY=a<v;

};


const xorA=(v)=>{

this.a=
(this.a^(v&0xFF))&0xFF;

this.Z=this.a===0;
this.N=0;
this.H=0;
this.CARRY=0;

};


const orA=(v)=>{

this.a=
(this.a|(v&0xFF))&0xFF;

this.Z=this.a===0;
this.N=0;
this.H=0;
this.CARRY=0;

};


const andA=(v)=>{

this.a=
(this.a&(v&0xFF))&0xFF;

this.Z=this.a===0;
this.N=0;
this.H=1;
this.CARRY=0;

};


/* =========================================================
   LD r,r
========================================================= */

if(
op>=0x40 &&
op<=0x7F
){

if(op===0x76){

this.halted=true;

return 4;

}

const dst=(op>>3)&7;
const src=op&7;

setR(
dst,
getR(src)
);

return(
dst===6 ||
src===6
)
?
8
:
4;

}


/* =========================================================
   ALU A,r
========================================================= */

if(
op>=0x80 &&
op<=0xBF
){

const r=op&7;
const v=getR(r);

if(op<0x88){

addA(v);

}
else if(op<0x90){

adcA(v);

}
else if(op<0x98){

subA(v);

}
else if(op<0xA0){

sbcA(v);

}
else if(op<0xA8){

andA(v);

}
else if(op<0xB0){

xorA(v);

}
else if(op<0xB8){

orA(v);

}
else{

cpA(v);

}

return r===6 ? 8 : 4;

}


/* =========================================================
   INC / DEC r
========================================================= */

if(
(op&0xC7)===0x04
){

const r=(op>>3)&7;

setR(
r,
inc8(getR(r))
);

return r===6 ? 12 : 4;

}


if(
(op&0xC7)===0x05
){

const r=(op>>3)&7;

setR(
r,
dec8(getR(r))
);

return r===6 ? 12 : 4;

}


/* =========================================================
   OPCODES
========================================================= */

switch(op){

case 0x00:
return 4;


case 0x10:

this.fetch8();
this.stopped=true;

return 4;


/* 16-bit loads */

case 0x01:
this.bc=this.fetch16();
return 12;

case 0x11:
this.de=this.fetch16();
return 12;

case 0x21:
this.hl=this.fetch16();
return 12;

case 0x31:
this.sp=this.fetch16();
return 12;


/* 16-bit INC */

case 0x03:
this.bc=(this.bc+1)&0xFFFF;
return 8;

case 0x13:
this.de=(this.de+1)&0xFFFF;
return 8;

case 0x23:
this.hl=(this.hl+1)&0xFFFF;
return 8;

case 0x33:
this.sp=(this.sp+1)&0xFFFF;
return 8;


/* 16-bit DEC */

case 0x0B:
this.bc=(this.bc-1)&0xFFFF;
return 8;

case 0x1B:
this.de=(this.de-1)&0xFFFF;
return 8;

case 0x2B:
this.hl=(this.hl-1)&0xFFFF;
return 8;

case 0x3B:
this.sp=(this.sp-1)&0xFFFF;
return 8;


/* LD r,n */

case 0x06:
this.b=this.fetch8();
return 8;

case 0x0E:
this.c=this.fetch8();
return 8;

case 0x16:
this.d=this.fetch8();
return 8;

case 0x1E:
this.e=this.fetch8();
return 8;

case 0x26:
this.h=this.fetch8();
return 8;

case 0x2E:
this.l=this.fetch8();
return 8;

case 0x36:

this.write(
this.hl,
this.fetch8()
);

return 12;

case 0x3E:
this.a=this.fetch8();
return 8;


/* Memory loads */

case 0x02:

this.write(
this.bc,
this.a
);

return 8;

case 0x12:

this.write(
this.de,
this.a
);

return 8;

case 0x0A:

this.a=
this.read(this.bc);

return 8;

case 0x1A:

this.a=
this.read(this.de);

return 8;

case 0x22:

this.write(
this.hl,
this.a
);

this.hl=
(this.hl+1)&0xFFFF;

return 8;

case 0x32:

this.write(
this.hl,
this.a
);

this.hl=
(this.hl-1)&0xFFFF;

return 8;

case 0x2A:

this.a=
this.read(this.hl);

this.hl=
(this.hl+1)&0xFFFF;

return 8;

case 0x3A:

this.a=
this.read(this.hl);

this.hl=
(this.hl-1)&0xFFFF;

return 8;


/* ADD HL */

case 0x09:{

const old=this.hl;
const v=this.bc;
const result=old+v;

this.N=0;
this.H=
((old&0xFFF)+(v&0xFFF))>0xFFF;
this.CARRY=result>0xFFFF;

this.hl=result&0xFFFF;

return 8;

}

case 0x19:{

const old=this.hl;
const v=this.de;
const result=old+v;

this.N=0;
this.H=
((old&0xFFF)+(v&0xFFF))>0xFFF;
this.CARRY=result>0xFFFF;

this.hl=result&0xFFFF;

return 8;

}

case 0x29:{

const old=this.hl;
const v=this.hl;
const result=old+v;

this.N=0;
this.H=
((old&0xFFF)+(v&0xFFF))>0xFFF;
this.CARRY=result>0xFFFF;

this.hl=result&0xFFFF;

return 8;

}

case 0x39:{

const old=this.hl;
const v=this.sp;
const result=old+v;

this.N=0;
this.H=
((old&0xFFF)+(v&0xFFF))>0xFFF;
this.CARRY=result>0xFFFF;

this.hl=result&0xFFFF;

return 8;

}


/* DAA */

case 0x27:{

let a=this.a;
let correction=0;

if(!this.N){

if(this.H || (a&0x0F)>9)
correction|=0x06;

if(this.CARRY || a>0x99){

correction|=0x60;
this.CARRY=1;

}

a=(a+correction)&0xFF;

}
else{

if(this.H)
correction|=0x06;

if(this.CARRY)
correction|=0x60;

a=(a-correction)&0xFF;

}

this.a=a;
this.Z=this.a===0;
this.H=0;

return 4;

}


/* ROTATES */

case 0x07:{

const carry=
(this.a&0x80)!==0;

this.a=
((this.a<<1)&0xFF)|
(carry?1:0);

this.Z=0;
this.N=0;
this.H=0;
this.CARRY=carry;

return 4;

}


case 0x0F:{

const carry=
(this.a&1)!==0;

this.a=
(this.a>>1)|
(carry?0x80:0);

this.Z=0;
this.N=0;
this.H=0;
this.CARRY=carry;

return 4;

}


case 0x17:{

const oldCarry=
this.CARRY?1:0;

const newCarry=
(this.a&0x80)!==0;

this.a=
((this.a<<1)&0xFF)|
oldCarry;

this.Z=0;
this.N=0;
this.H=0;
this.CARRY=newCarry;

return 4;

}


case 0x1F:{

const oldCarry=
this.CARRY?1:0;

const newCarry=
(this.a&1)!==0;

this.a=
(this.a>>1)|
(oldCarry?0x80:0);

this.Z=0;
this.N=0;
this.H=0;
this.CARRY=newCarry;

return 4;

}


/* CPL / SCF / CCF */

case 0x2F:

this.a=
(~this.a)&0xFF;

this.N=1;
this.H=1;

return 4;


case 0x37:

this.N=0;
this.H=0;
this.CARRY=1;

return 4;


case 0x3F:

this.N=0;
this.H=0;
this.CARRY=!this.CARRY;

return 4;


/* ALU immediate */

case 0xC6:
addA(this.fetch8());
return 8;

case 0xCE:
adcA(this.fetch8());
return 8;

case 0xD6:
subA(this.fetch8());
return 8;

case 0xDE:
sbcA(this.fetch8());
return 8;

case 0xE6:
andA(this.fetch8());
return 8;

case 0xEE:
xorA(this.fetch8());
return 8;

case 0xF6:
orA(this.fetch8());
return 8;

case 0xFE:
cpA(this.fetch8());
return 8;


/* XOR A */

case 0xAF:

this.a=0;

this.Z=1;
this.N=0;
this.H=0;
this.CARRY=0;

return 4;


/* JP */

case 0xC3:

this.pc=
this.fetch16();

return 16;


/* JP NZ */

case 0xC2:{

const addr=
this.fetch16();

if(!this.Z){

this.pc=addr;

return 16;

}

return 12;

}


/* JP Z */

case 0xCA:{

const addr=
this.fetch16();

if(this.Z){

this.pc=addr;

return 16;

}

return 12;

}


/* JP NC */

case 0xD2:{

const addr=
this.fetch16();

if(!this.CARRY){

this.pc=addr;

return 16;

}

return 12;

}


/* JP C */

case 0xDA:{

const addr=
this.fetch16();

if(this.CARRY){

this.pc=addr;

return 16;

}

return 12;

}


/* JP HL */

case 0xE9:

this.pc=this.hl;

return 4;


/* JR */

case 0x18:{

const off=this.fetch8();

const signed=
off<128
?
off
:
off-256;

this.pc=
(this.pc+signed)&0xFFFF;

return 12;

}


/* JR NZ */

case 0x20:{

const off=this.fetch8();

if(!this.Z){

const signed=
off<128
?
off
:
off-256;

this.pc=
(this.pc+signed)&0xFFFF;

return 12;

}

return 8;

}


/* JR Z */

case 0x28:{

const off=this.fetch8();

if(this.Z){

const signed=
off<128
?
off
:
off-256;

this.pc=
(this.pc+signed)&0xFFFF;

return 12;

}

return 8;

}


/* JR NC */

case 0x30:{

const off=this.fetch8();

if(!this.CARRY){

const signed=
off<128
?
off
:
off-256;

this.pc=
(this.pc+signed)&0xFFFF;

return 12;

}

return 8;

}


/* JR C */

case 0x38:{

const off=this.fetch8();

if(this.CARRY){

const signed=
off<128
?
off
:
off-256;

this.pc=
(this.pc+signed)&0xFFFF;

return 12;

}

return 8;

}


/* CALL */

case 0xCD:{

const addr=
this.fetch16();

this.push16(this.pc);

this.pc=addr;

return 24;

}


/* Conditional CALL */

case 0xC4:{

const addr=this.fetch16();

if(!this.Z){

this.push16(this.pc);
this.pc=addr;

return 24;

}

return 12;

}


case 0xCC:{

const addr=this.fetch16();

if(this.Z){

this.push16(this.pc);
this.pc=addr;

return 24;

}

return 12;

}


case 0xD4:{

const addr=this.fetch16();

if(!this.CARRY){

this.push16(this.pc);
this.pc=addr;

return 24;

}

return 12;

}


case 0xDC:{

const addr=this.fetch16();

if(this.CARRY){

this.push16(this.pc);
this.pc=addr;

return 24;

}

return 12;

}


/* RET */

case 0xC9:

this.pc=
this.pop16();

return 16;


/* Conditional RET */

case 0xC0:

if(!this.Z){

this.pc=
this.pop16();

return 20;

}

return 8;


case 0xC8:

if(this.Z){

this.pc=
this.pop16();

return 20;

}

return 8;


case 0xD0:

if(!this.CARRY){

this.pc=
this.pop16();

return 20;

}

return 8;


case 0xD8:

if(this.CARRY){

this.pc=
this.pop16();

return 20;

}

return 8;


/* RETI */

case 0xD9:

this.pc=
this.pop16();

this.ime=true;

return 16;


/* PUSH */

case 0xC5:
this.push16(this.bc);
return 16;

case 0xD5:
this.push16(this.de);
return 16;

case 0xE5:
this.push16(this.hl);
return 16;

case 0xF5:
this.push16(this.af);
return 16;


/* POP */

case 0xC1:
this.bc=this.pop16();
return 12;

case 0xD1:
this.de=this.pop16();
return 12;

case 0xE1:
this.hl=this.pop16();
return 12;

case 0xF1:
this.af=this.pop16();
return 12;


/* DI */

case 0xF3:

this.ime=false;
this.imeDelay=0;

return 4;


/* EI */

case 0xFB:

this.ime=true;

return 4;


/* LD (nn),SP */

case 0x08:{

const addr=
this.fetch16();

this.write(
addr,
this.sp&0xFF
);

this.write(
(addr+1)&0xFFFF,
(this.sp>>8)&0xFF
);

return 20;

}


/* LD SP,HL */

case 0xF9:

this.sp=this.hl;

return 8;


/* ADD SP,e8 */

case 0xE8:{

const value=
this.fetch8();

const signed=
value<128
?
value
:
value-256;

const sp=this.sp;

this.Z=0;
this.N=0;

this.H=
((sp&0x0F)+(value&0x0F))>0x0F;

this.CARRY=
((sp&0xFF)+(value&0xFF))>0xFF;

this.sp=
(sp+signed)&0xFFFF;

return 16;

}


/* LD HL,SP+e8 */

case 0xF8:{

const value=
this.fetch8();

const signed=
value<128
?
value
:
value-256;

const sp=this.sp;

this.Z=0;
this.N=0;

this.H=
((sp&0x0F)+(value&0x0F))>0x0F;

this.CARRY=
((sp&0xFF)+(value&0xFF))>0xFF;

this.hl=
(sp+signed)&0xFFFF;

return 12;

}


/* LD (C),A */

case 0xE2:

this.write(
0xFF00+this.c,
this.a
);

return 8;


/* LD A,(C) */

case 0xF2:

this.a=
this.read(
0xFF00+this.c
);

return 8;


/* LD (FF00+n),A */

case 0xE0:{

const n=
this.fetch8();

this.write(
0xFF00+n,
this.a
);

return 12;

}


/* LD A,(FF00+n) */

case 0xF0:{

const n=
this.fetch8();

this.a=
this.read(
0xFF00+n
);

return 12;

}


/* LD (nn),A */

case 0xEA:{

const addr=
this.fetch16();

this.write(
addr,
this.a
);

return 16;

}


/* LD A,(nn) */

case 0xFA:{

const addr=
this.fetch16();

this.a=
this.read(addr);

return 16;

}


/* HALT */

case 0x76:

this.halted=true;

return 4;


/* CB */

case 0xCB:{

const cb=
this.fetch8();

const r=cb&7;
const group=cb>>6;
const bit=(cb>>3)&7;

let value=
getR(r);


/* ROTATE / SHIFT */

if(group===0){

const operation=
(cb>>3)&7;

let result=0;
let carry=0;


switch(operation){

case 0:

carry=
(value&0x80)!==0;

result=
((value<<1)&0xFF)|
(carry?1:0);

break;


case 1:

carry=
(value&1)!==0;

result=
(value>>1)|
(carry?0x80:0);

break;


case 2:{

const oldCarry=
this.CARRY?1:0;

carry=
(value&0x80)!==0;

result=
((value<<1)&0xFF)|
oldCarry;

break;

}


case 3:{

const oldCarry=
this.CARRY?1:0;

carry=
(value&1)!==0;

result=
(value>>1)|
(oldCarry?0x80:0);

break;

}


case 4:

carry=
(value&0x80)!==0;

result=
(value<<1)&0xFF;

break;


case 5:

carry=
(value&1)!==0;

result=
(value>>1)|
(value&0x80);

break;


case 6:

result=
((value&0x0F)<<4)|
((value&0xF0)>>4);

carry=0;

break;


case 7:

carry=
(value&1)!==0;

result=
value>>1;

break;

}


setR(r,result);

this.Z=result===0;
this.N=0;
this.H=0;
this.CARRY=carry;

return r===6 ? 16 : 8;

}


/* BIT */

if(group===1){

this.Z=
(value&(1<<bit))===0;

this.N=0;
this.H=1;

return r===6 ? 12 : 8;

}


/* RES */

if(group===2){

value&=
~(1<<bit);

setR(r,value);

return r===6 ? 16 : 8;

}


/* SET */

if(group===3){

value|=
(1<<bit);

setR(r,value);

return r===6 ? 16 : 8;

}


return 8;

}


/* RST */

case 0xC7:
this.push16(this.pc);
this.pc=0x00;
return 16;

case 0xCF:
this.push16(this.pc);
this.pc=0x08;
return 16;

case 0xD7:
this.push16(this.pc);
this.pc=0x10;
return 16;

case 0xDF:
this.push16(this.pc);
this.pc=0x18;
return 16;

case 0xE7:
this.push16(this.pc);
this.pc=0x20;
return 16;

case 0xEF:
this.push16(this.pc);
this.pc=0x28;
return 16;

case 0xF7:
this.push16(this.pc);
this.pc=0x30;
return 16;

case 0xFF:
this.push16(this.pc);
this.pc=0x38;
return 16;


/* Illegal opcodes */

case 0xD3:
case 0xDB:
case 0xDD:
case 0xE3:
case 0xE4:
case 0xEB:
case 0xEC:
case 0xED:
case 0xF4:
case 0xFC:
case 0xFD:

return 4;


/* Unknown */

default:

console.warn(
"Unknown Game Boy opcode 0x"+
op.toString(16).padStart(2,"0")+
" at 0x"+
((this.pc-1)&0xFFFF)
.toString(16).padStart(4,"0")
);

return 4;

}

}

}


/* =========================================================
   GAME BOY CPU
========================================================= */

const gbCPU=
new GBCPU();


/* =========================================================
   RESET GAME BOY
========================================================= */

function gbReset(){

gbHardwareReset();

gbCartridge.romBank=1;
gbCartridge.ramBank=0;
gbCartridge.ramEnabled=false;
gbCartridge.bankingMode=0;

gbCPU.reset();

}


/* =========================================================
   PPU STAT
========================================================= */

function gbUpdateSTAT(){

if(!(gbPPU.lcdc&0x80)){

gbPPU.mode=0;

}
else{

if(gbPPU.ly>=144){

gbPPU.mode=1;

}
else if(gbPPU.cycles<80){

gbPPU.mode=2;

}
else if(gbPPU.cycles<252){

gbPPU.mode=3;

}
else{

gbPPU.mode=0;

}

}


let stat=
gbPPU.stat&0x78;

stat|=
gbPPU.mode;

if(gbPPU.ly===gbPPU.lyc)
stat|=0x04;

gbPPU.stat=
stat|0x80;

}


/* =========================================================
   PPU STEP
========================================================= */

function gbPPUStep(cycles){

if(!(gbPPU.lcdc&0x80))
return;


gbPPU.cycles+=cycles;

while(gbPPU.cycles>=456){

gbPPU.cycles-=456;

gbPPU.ly++;


if(gbPPU.ly===144){

gbMemory[0xFF0F]|=0x01;

}


if(gbPPU.ly>=154){

gbPPU.ly=0;

}

}


gbUpdateSTAT();

}


/* =========================================================
   PPU PALETTE
========================================================= */

function gbPaletteShade(palette,color){

return(
palette>>
(color*2)
)&3;

}


/* =========================================================
   PPU DRAW
========================================================= */

function gbPPUDrawBackground(){

const ctx=c.getContext("2d");

const image=
ctx.createImageData(160,144);

const palette=[
255,
192,
96,
0
];

const bgColorIndex=
new Uint8Array(160*144);


/* BACKGROUND */

for(let y=0;y<144;y++){

for(let screenX=0;screenX<160;screenX++){

let color=0;


if(gbPPU.lcdc&0x01){

const worldX=
(screenX+gbPPU.scx)&255;

const worldY=
(y+gbPPU.scy)&255;

const tileX=
worldX>>3;

const tileY=
worldY>>3;

const mapBase=
(gbPPU.lcdc&0x08)
?
0x9C00
:
0x9800;

const mapAddress=
mapBase+
tileY*32+
tileX;

const tileIndex=
gbRead(mapAddress);

let tileAddress;

if(gbPPU.lcdc&0x10){

tileAddress=
0x8000+
tileIndex*16;

}
else{

const signedTile=
tileIndex<128
?
tileIndex
:
tileIndex-256;

tileAddress=
0x9000+
signedTile*16;

}


const row=
worldY&7;

const low=
gbRead(
tileAddress+
row*2
);

const high=
gbRead(
tileAddress+
row*2+1
);

const bit=
7-(worldX&7);

color=
((high>>bit)&1)*2+
((low>>bit)&1);

}


bgColorIndex[
y*160+screenX
]=color;

const shade=
palette[
gbPaletteShade(
gbPPU.bgp,
color
)
];

const i=
(y*160+screenX)*4;

image.data[i]=shade;
image.data[i+1]=shade;
image.data[i+2]=shade;
image.data[i+3]=255;

}

}


/* WINDOW */

if(gbPPU.lcdc&0x20){

const wy=gbPPU.wy;
const wx=gbPPU.wx-7;

if(wy<144){

for(let y=Math.max(0,wy);y<144;y++){

const windowY=
y-wy;

const tileY=
windowY>>3;

for(
let screenX=Math.max(0,wx);
screenX<160;
screenX++
){

const windowX=
screenX-wx;

if(windowX<0)
continue;

const tileX=
windowX>>3;

if(tileX>=32)
continue;

const mapBase=
(gbPPU.lcdc&0x40)
?
0x9C00
:
0x9800;

const tileIndex=
gbRead(
mapBase+
tileY*32+
tileX
);

let tileAddress;

if(gbPPU.lcdc&0x10){

tileAddress=
0x8000+
tileIndex*16;

}
else{

const signedTile=
tileIndex<128
?
tileIndex
:
tileIndex-256;

tileAddress=
0x9000+
signedTile*16;

}

const row=
windowY&7;

const low=
gbRead(
tileAddress+
row*2
);

const high=
gbRead(
tileAddress+
row*2+1
);

const bit=
7-(windowX&7);

const color=
((high>>bit)&1)*2+
((low>>bit)&1);

bgColorIndex[
y*160+screenX
]=color;

const shade=
palette[
gbPaletteShade(
gbPPU.bgp,
color
)
];

const i=
(y*160+screenX)*4;

image.data[i]=shade;
image.data[i+1]=shade;
image.data[i+2]=shade;
image.data[i+3]=255;

}

}

}

}


/* SPRITES */

if(gbPPU.lcdc&0x02){

const spriteHeight=
(gbPPU.lcdc&0x04)
?
16
:
8;


for(let sprite=0;sprite<40;sprite++){

const base=
sprite*4;

const sy=
gbOAM[base]-16;

const sx=
gbOAM[base+1]-8;

let tile=
gbOAM[base+2];

const flags=
gbOAM[base+3];

const flipX=
!!(flags&0x20);

const flipY=
!!(flags&0x40);

const behindBG=
!!(flags&0x80);

const spritePalette=
(flags&0x10)
?
gbPPU.obp1
:
gbPPU.obp0;


if(spriteHeight===16)
tile&=0xFE;


for(let py=0;py<spriteHeight;py++){

let actualY=
flipY
?
spriteHeight-1-py
:
py;

let tileNumber=
tile;

if(spriteHeight===16){

if(actualY>=8){

tileNumber=
tile+1;

actualY-=8;

}

}


const low=
gbRead(
0x8000+
tileNumber*16+
actualY*2
);

const high=
gbRead(
0x8000+
tileNumber*16+
actualY*2+1
);


for(let px=0;px<8;px++){

const actualX=
flipX
?
px
:
7-px;

const color=
((high>>actualX)&1)*2+
((low>>actualX)&1);

if(color===0)
continue;


const screenX=
sx+px;

const screenY=
sy+py;


if(
screenX<0 ||
screenX>=160 ||
screenY<0 ||
screenY>=144
)
continue;


if(
behindBG &&
bgColorIndex[
screenY*160+screenX
]!==0
)
continue;


const shade=
palette[
gbPaletteShade(
spritePalette,
color
)
];

const i=
(screenY*160+screenX)*4;

image.data[i]=shade;
image.data[i+1]=shade;
image.data[i+2]=shade;
image.data[i+3]=255;

}

}

}

}


ctx.putImageData(
image,
0,
0
);

}


/* =========================================================
   GAME BOY FRAME
========================================================= */

const GB_CYCLES_PER_FRAME=70224;


function gbRunFrame(){

if(!gbROMLoaded)
return;


let cycles=0;

while(cycles<GB_CYCLES_PER_FRAME){

const used=
gbCPU.step();

const actual=
used>0
?
used
:
4;

gbTimerStep(actual);
gbPPUStep(actual);

cycles+=actual;

}


gbPPUDrawBackground();

}


/* =========================================================
   TIMER
========================================================= */

function gbTimerStep(cycles){

gbTimer.div=
(gbTimer.div+cycles)&0xFFFF;


if(!(gbTimer.tac&0x04))
return;


gbTimer.counter+=cycles;


const frequencies=[
1024,
16,
64,
256
];

const threshold=
frequencies[
gbTimer.tac&3
];


while(
gbTimer.counter>=threshold
){

gbTimer.counter-=threshold;


if(gbTimer.tima===0xFF){

gbTimer.tima=
gbTimer.tma;

gbMemory[0xFF0F]|=0x04;

}
else{

gbTimer.tima=
(gbTimer.tima+1)&0xFF;

}

}

}


/* =========================================================
   ROM LOADER
========================================================= */

const GB_ROM_PATH=
"roms/Super Mario Land.gb";


let gbROM=null;
let gbROMLoaded=false;


async function loadGBROM(){

try{

const response=
await fetch(
GB_ROM_PATH,
{
cache:"no-store"
}
);


if(!response.ok){

throw new Error(
"HTTP "+response.status
);

}


const buffer=
await response.arrayBuffer();


gbROM=
new Uint8Array(buffer);


gbCartridge.rom=
gbROM;


gbCartridge.romSize=
gbROM.length;


gbDetectCartridge();


gbHardwareReset();

gbCPU.reset();

gbROMLoaded=true;


console.log(
"Game Boy ROM loaded:",
GB_ROM_PATH
);

console.log(
"ROM size:",
gbROM.length,
"bytes"
);


console.log(
"ROM[0100-010F]:",
Array.from(
{length:16},
(_,i)=>
gbRead(0x0100+i)
.toString(16)
.padStart(2,"0")
).join(" ")
);


console.log(
"Entry opcode:",
"0x"+
gbRead(0x0100)
.toString(16)
.padStart(2,"0")
);


let title="";


for(
let i=0x0134;
i<=0x0143;
i++
){

const ch=
gbROM[i];

if(
ch>=32 &&
ch<=126
){

title+=
String.fromCharCode(ch);

}

}


console.log(
"Cartridge title:",
title.trim()
);


gbCPU.reset();


}
catch(e){

gbROMLoaded=false;

console.error(
"Game Boy ROM loading failed:",
e
);

}

}


/* =========================================================
   CARTRIDGE HEADER
========================================================= */

function gbDetectCartridge(){

if(!gbCartridge.rom)
return;


gbCartridge.mbcType=
gbCartridge.rom[0x0147]||0;


const romSizeCode=
gbCartridge.rom[0x0148]||0;


if(romSizeCode<=8){

gbCartridge.romSize=
32768*
(1<<romSizeCode);

}
else{

gbCartridge.romSize=
gbCartridge.rom.length;

}


console.log(
"Game Boy cartridge type:",
"0x"+
gbCartridge.mbcType
.toString(16)
.padStart(2,"0")
);

console.log(
"Game Boy cartridge ROM:",
gbCartridge.romSize,
"bytes"
);

}


/* =========================================================
   GAME LOOP
========================================================= */

function loop(t){

last=t;

if(gbROMLoaded){

if(!pause){

gbRunFrame();

}

}

requestAnimationFrame(loop);

}


/* =========================================================
   START
========================================================= */

gbHardwareReset();

requestAnimationFrame(gp);

requestAnimationFrame(loop);


setTimeout(
function(){

try{

jumpBtn.focus();

}
catch(e){}

},
300
);


loadGBROM();
